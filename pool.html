<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mini Pool Game - 8 Ball & 9 Ball</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
            border-radius: 6px;
            background: #0d5c2a;
            display: none;
        }
        /* UI Menu Pilihan Game */
        #menu-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
        }
        #menu-overlay h1 {
            font-size: 32px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #f39c12;
        }
        .btn-group {
            display: flex;
            gap: 20px;
        }
        .mode-btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: #27ae60;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .mode-btn:hover {
            background: #2ecc71;
            transform: scale(1.05);
        }
        #ui-bar {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 1px 1px 3px black;
            background: rgba(0,0,0,0.5);
            padding: 6px 16px;
            border-radius: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="menu-overlay">
            <h1>Pilih Mode Permainan</h1>
            <div class="btn-group">
                <button class="mode-btn" onclick="startGame(8)">8-Ball</button>
                <button class="mode-btn" onclick="startGame(9)">9-Ball</button>
            </div>
        </div>

        <div id="ui-bar">Tarik bola putih untuk menembak</div>
        <canvas id="poolCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('poolCanvas');
        const ctx = canvas.getContext('2d');
        const menuOverlay = document.getElementById('menu-overlay');
        const uiBar = document.getElementById('ui-bar');

        const TABLE_WIDTH = 800;
        const TABLE_HEIGHT = 400;
        const BORDER = 30;
        const BALL_RADIUS = 10;

        let currentGameMode = 8;

        function resizeCanvas() {
            const aspect = TABLE_WIDTH / TABLE_HEIGHT;
            let w = window.innerWidth * 0.95;
            let h = window.innerHeight * 0.95;

            if (w / h > aspect) {
                w = h * aspect;
            } else {
                h = w / aspect;
            }

            canvas.width = TABLE_WIDTH;
            canvas.height = TABLE_HEIGHT;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Ball {
            constructor(x, y, color, number = 0, isCue = false) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.color = color;
                this.number = number;
                this.isCue = isCue;
                this.pocketed = false;
            }

            update() {
                if (this.pocketed) return;

                this.x += this.vx;
                this.y += this.vy;

                // Gesekan
                this.vx *= 0.985;
                this.vy *= 0.985;

                if (Math.hypot(this.vx, this.vy) < 0.05) {
                    this.vx = 0;
                    this.vy = 0;
                }

                // Pantulan Dinding
                const minX = BORDER + BALL_RADIUS;
                const maxX = TABLE_WIDTH - BORDER - BALL_RADIUS;
                const minY = BORDER + BALL_RADIUS;
                const maxY = TABLE_HEIGHT - BORDER - BALL_RADIUS;

                if (this.x < minX) { this.x = minX; this.vx *= -1; }
                if (this.x > maxX) { this.x = maxX; this.vx *= -1; }
                if (this.y < minY) { this.y = minY; this.vy *= -1; }
                if (this.y > maxY) { this.y = maxY; this.vy *= -1; }
            }

            draw() {
                if (this.pocketed) return;

                ctx.beginPath();
                ctx.arc(this.x, this.y, BALL_RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.closePath();

                // Angka Bola
                if (!this.isCue && this.number > 0) {
                    ctx.fillStyle = (this.color === 'white' || this.color === 'yellow') ? 'black' : 'white';
                    ctx.font = 'bold 9px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.number, this.x, this.y);
                }
            }
        }

        const pockets = [
            { x: BORDER, y: BORDER },
            { x: TABLE_WIDTH / 2, y: BORDER - 5 },
            { x: TABLE_WIDTH - BORDER, y: BORDER },
            { x: BORDER, y: TABLE_HEIGHT - BORDER },
            { x: TABLE_WIDTH / 2, y: TABLE_HEIGHT - BORDER + 5 },
            { x: TABLE_WIDTH - BORDER, y: TABLE_HEIGHT - BORDER }
        ];

        let balls = [];
        let cueBall;

        function initBalls(mode) {
            balls = [];
            cueBall = new Ball(TABLE_WIDTH * 0.25, TABLE_HEIGHT / 2, 'white', 0, true);
            balls.push(cueBall);

            const startX = TABLE_WIDTH * 0.7;
            const startY = TABLE_HEIGHT / 2;

            const ballColors = [
                '#f1c40f', '#2980b9', '#e74c3c', '#8e44ad', '#e67e22',
                '#27ae60', '#95a5a6', '#2c3e50', '#f39c12'
            ];

            if (mode === 8) {
                // Susunan Segitiga 8-Ball (15 Bola)
                let ballIndex = 1;
                const rows = 5;
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c <= r; c++) {
                        const x = startX + r * (BALL_RADIUS * 2 * 0.866);
                        const y = startY + (c - r / 2) * (BALL_RADIUS * 2 + 1);
                        const color = ballColors[(ballIndex - 1) % ballColors.length];
                        balls.push(new Ball(x, y, color, ballIndex));
                        ballIndex++;
                    }
                }
            } else if (mode === 9) {
                // Susunan Diamond 9-Ball (9 Bola)
                const diamondLayout = [
                    [0, 0],
                    [1, -0.5], [1, 0.5],
                    [2, -1], [2, 0], [2, 1],
                    [3, -0.5], [3, 0.5],
                    [4, 0]
                ];
                diamondLayout.forEach((pos, idx) => {
                    const x = startX + pos[0] * (BALL_RADIUS * 2 * 0.866);
                    const y = startY + pos[1] * (BALL_RADIUS * 2 + 1);
                    const color = ballColors[idx % ballColors.length];
                    balls.push(new Ball(x, y, color, idx + 1));
                });
            }
        }

        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let dragCurrent = { x: 0, y: 0 };

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            return {
                x: (clientX - rect.left) * (TABLE_WIDTH / rect.width),
                y: (clientY - rect.top) * (TABLE_HEIGHT / rect.height)
            };
        }

        function areBallsStopped() {
            return balls.every(b => b.vx === 0 && b.vy === 0);
        }

        function handleStart(e) {
            if (!areBallsStopped()) return;
            const coords = getCanvasCoords(e);
            const dist = Math.hypot(coords.x - cueBall.x, coords.y - cueBall.y);

            if (dist < BALL_RADIUS * 3) {
                isDragging = true;
                dragStart = coords;
                dragCurrent = coords;
            }
        }

        function handleMove(e) {
            if (!isDragging) return;
            dragCurrent = getCanvasCoords(e);
        }

        function handleEnd() {
            if (!isDragging) return;
            isDragging = false;

            const dx = dragStart.x - dragCurrent.x;
            const dy = dragStart.y - dragCurrent.y;
            const power = Math.min(Math.hypot(dx, dy) * 0.15, 22);

            const angle = Math.atan2(dy, dx);
            cueBall.vx = Math.cos(angle) * power;
            cueBall.vy = Math.sin(angle) * power;
        }

        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        canvas.addEventListener('touchstart', handleStart);
        canvas.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);

        function resolveCollisions() {
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    const b1 = balls[i];
                    const b2 = balls[j];

                    if (b1.pocketed || b2.pocketed) continue;

                    const dx = b2.x - b1.x;
                    const dy = b2.y - b1.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < BALL_RADIUS * 2) {
                        const angle = Math.atan2(dy, dx);
                        const sin = Math.sin(angle);
                        const cos = Math.cos(angle);

                        const overlap = (BALL_RADIUS * 2) - dist;
                        b1.x -= cos * overlap * 0.5;
                        b1.y -= sin * overlap * 0.5;
                        b2.x += cos * overlap * 0.5;
                        b2.y += sin * overlap * 0.5;

                        const vx1 = b1.vx * cos + b1.vy * sin;
                        const vy1 = b1.vy * cos - b1.vx * sin;
                        const vx2 = b2.vx * cos + b2.vy * sin;
                        const vy2 = b2.vy * cos - b2.vx * sin;

                        b1.vx = vx2 * cos - vy1 * sin;
                        b1.vy = vy1 * cos + vx2 * sin;
                        b2.vx = vx1 * cos - vy2 * sin;
                        b2.vy = vy2 * cos + vx1 * sin;
                    }
                }
            }
        }

        function checkPockets() {
            balls.forEach(b => {
                if (b.pocketed) return;
                pockets.forEach(p => {
                    const dist = Math.hypot(b.x - p.x, b.y - p.y);
                    if (dist < BORDER * 0.8) {
                        b.pocketed = true;
                        b.vx = 0;
                        b.vy = 0;

                        if (b.isCue) {
                            setTimeout(() => {
                                b.x = TABLE_WIDTH * 0.25;
                                b.y = TABLE_HEIGHT / 2;
                                b.pocketed = false;
                            }, 500);
                        }
                    }
                });
            });
        }

        function drawTable() {
            // Bingkai Kayu
            ctx.fillStyle = '#3a1e0e';
            ctx.fillRect(0, 0, TABLE_WIDTH, TABLE_HEIGHT);

            // Lapisan Karpet
            ctx.fillStyle = '#0d5c2a';
            ctx.fillRect(BORDER, BORDER, TABLE_WIDTH - BORDER * 2, TABLE_HEIGHT - BORDER * 2);

            // Lubang
            pockets.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, BORDER * 0.65, 0, Math.PI * 2);
                ctx.fillStyle = '#111';
                ctx.fill();
                ctx.closePath();
            });
        }

        function gameLoop() {
            ctx.clearRect(0, 0, TABLE_WIDTH, TABLE_HEIGHT);

            drawTable();

            balls.forEach(b => b.update());
            resolveCollisions();
            checkPockets();
            balls.forEach(b => b.draw());

            // Garis Bantuan Aiming & Visual Stik
            if (isDragging && cueBall) {
                const dx = dragStart.x - dragCurrent.x;
                const dy = dragStart.y - dragCurrent.y;
                const dist = Math.hypot(dx, dy);
                const angle = Math.atan2(dy, dx);

                // Garis Bantu Putus-putus
                ctx.beginPath();
                ctx.moveTo(cueBall.x, cueBall.y);
                ctx.lineTo(cueBall.x + Math.cos(angle) * 400, cueBall.y + Math.sin(angle) * 400);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([6, 6]);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.closePath();

                // Stik Biliard Kayu
                const stickOffset = 15 + Math.min(dist * 0.4, 60);
                const stickLength = 260;

                const stickStartX = cueBall.x - Math.cos(angle) * stickOffset;
                const stickStartY = cueBall.y - Math.sin(angle) * stickOffset;
                const stickEndX = cueBall.x - Math.cos(angle) * (stickOffset + stickLength);
                const stickEndY = cueBall.y - Math.sin(angle) * (stickOffset + stickLength);

                ctx.beginPath();
                ctx.moveTo(stickStartX, stickStartY);
                ctx.lineTo(stickEndX, stickEndY);
                ctx.strokeStyle = '#d35400';
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.stroke();
                ctx.closePath();
            }

            requestAnimationFrame(gameLoop);
        }

        function startGame(mode) {
            currentGameMode = mode;
            menuOverlay.style.display = 'none';
            canvas.style.display = 'block';
            uiBar.style.display = 'block';

            initBalls(mode);
            gameLoop();
        }
    </script>
</body>
</html>
