<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mini Pool Game Pro Controls</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
            border-radius: 6px;
            background: #0d5c2a;
            display: none;
        }
        #menu-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: white;
        }
        #menu-overlay h1 {
            font-size: 32px;
            margin-bottom: 20px;
            text-transform: uppercase;
            color: #f39c12;
        }
        .btn-group {
            display: flex;
            gap: 20px;
        }
        .mode-btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: #27ae60;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .mode-btn:hover {
            background: #2ecc71;
            transform: scale(1.05);
        }

        /* Panel Kontrol Kiri & Kanan */
        .control-panel {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            display: none;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 10px;
            border-radius: 12px;
            color: white;
            z-index: 10;
        }
        #panel-left { left: 15px; }
        #panel-right { right: 15px; }

        .control-panel label {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .slider-vertical {
            writing-mode: bt-lr; /* IE/Edge */
            -webkit-appearance: slider-vertical; /* Webkit */
            width: 25px;
            height: 180px;
            cursor: pointer;
        }

        #shoot-btn {
            margin-top: 15px;
            padding: 10px 15px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        #shoot-btn:active {
            background: #c0392b;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="menu-overlay">
            <h1>Pilih Mode Permainan</h1>
            <div class="btn-group">
                <button class="mode-btn" onclick="startGame(8)">8-Ball</button>
                <button class="mode-btn" onclick="startGame(9)">9-Ball</button>
            </div>
        </div>

        <div id="panel-left" class="control-panel">
            <label>Power</label>
            <input type="range" id="power-slider" class="slider-vertical" min="1" max="100" value="30">
            <button id="shoot-btn" onclick="shootBall()">TEMBAK</button>
        </div>

        <div id="panel-right" class="control-panel">
            <label>Arah</label>
            <input type="range" id="angle-slider" class="slider-vertical" min="0" max="360" value="0">
        </div>

        <canvas id="poolCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('poolCanvas');
        const ctx = canvas.getContext('2d');
        const menuOverlay = document.getElementById('menu-overlay');
        const panelLeft = document.getElementById('panel-left');
        const panelRight = document.getElementById('panel-right');
        const powerSlider = document.getElementById('power-slider');
        const angleSlider = document.getElementById('angle-slider');

        const TABLE_WIDTH = 800;
        const TABLE_HEIGHT = 400;
        const BORDER = 30;
        const BALL_RADIUS = 10;

        let balls = [];
        let cueBall;
        let aimAngle = 0; // Sudut tembakan dalam radian

        function resizeCanvas() {
            const aspect = TABLE_WIDTH / TABLE_HEIGHT;
            let w = window.innerWidth * 0.85; // Menyeimbangkan UI kiri & kanan
            let h = window.innerHeight * 0.85;

            if (w / h > aspect) { w = h * aspect; } 
            else { h = w / aspect; }

            canvas.width = TABLE_WIDTH;
            canvas.height = TABLE_HEIGHT;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Ball {
            constructor(x, y, color, number = 0, isCue = false) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.color = color;
                this.number = number;
                this.isCue = isCue;
                this.pocketed = false;
            }

            update() {
                if (this.pocketed) return;

                this.x += this.vx;
                this.y += this.vy;

                // Gesekan
                this.vx *= 0.985;
                this.vy *= 0.985;

                if (Math.hypot(this.vx, this.vy) < 0.05) {
                    this.vx = 0;
                    this.vy = 0;
                }

                // Dinding
                const minX = BORDER + BALL_RADIUS;
                const maxX = TABLE_WIDTH - BORDER - BALL_RADIUS;
                const minY = BORDER + BALL_RADIUS;
                const maxY = TABLE_HEIGHT - BORDER - BALL_RADIUS;

                if (this.x < minX) { this.x = minX; this.vx *= -1; }
                if (this.x > maxX) { this.x = maxX; this.vx *= -1; }
                if (this.y < minY) { this.y = minY; this.vy *= -1; }
                if (this.y > maxY) { this.y = maxY; this.vy *= -1; }
            }

            draw() {
                if (this.pocketed) return;

                ctx.beginPath();
                ctx.arc(this.x, this.y, BALL_RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.closePath();

                // Penanda Khusus Bola Putih (Cue Mark)
                if (this.isCue) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                    ctx.fillStyle = '#000';
                    ctx.fill();
                    ctx.closePath();
                } else if (this.number > 0) {
                    ctx.fillStyle = (this.color === 'white' || this.color === '#f1c40f') ? 'black' : 'white';
                    ctx.font = 'bold 8px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.number, this.x, this.y);
                }
            }
        }

        const pockets = [
            { x: BORDER, y: BORDER },
            { x: TABLE_WIDTH / 2, y: BORDER - 5 },
            { x: TABLE_WIDTH - BORDER, y: BORDER },
            { x: BORDER, y: TABLE_HEIGHT - BORDER },
            { x: TABLE_WIDTH / 2, y: TABLE_HEIGHT - BORDER + 5 },
            { x: TABLE_WIDTH - BORDER, y: TABLE_HEIGHT - BORDER }
        ];

        function initBalls(mode) {
            balls = [];
            cueBall = new Ball(TABLE_WIDTH * 0.25, TABLE_HEIGHT / 2, 'white', 0, true);
            balls.push(cueBall);

            const startX = TABLE_WIDTH * 0.7;
            const startY = TABLE_HEIGHT / 2;
            const colors = ['#f1c40f', '#2980b9', '#e74c3c', '#8e44ad', '#e67e22', '#27ae60', '#95a5a6', '#2c3e50', '#f39c12'];

            if (mode === 8) {
                let idx = 1;
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c <= r; c++) {
                        const x = startX + r * (BALL_RADIUS * 2 * 0.866);
                        const y = startY + (c - r / 2) * (BALL_RADIUS * 2 + 1);
                        balls.push(new Ball(x, y, colors[(idx - 1) % colors.length], idx));
                        idx++;
                    }
                }
            } else {
                const layout = [[0,0], [1,-0.5], [1,0.5], [2,-1], [2,0], [2,1], [3,-0.5], [3,0.5], [4,0]];
                layout.forEach((pos, i) => {
                    const x = startX + pos[0] * (BALL_RADIUS * 2 * 0.866);
                    const y = startY + pos[1] * (BALL_RADIUS * 2 + 1);
                    balls.push(new Ball(x, y, colors[i % colors.length], i + 1));
                });
            }
        }

        function areBallsStopped() {
            return balls.every(b => b.vx === 0 && b.vy === 0);
        }

        function shootBall() {
            if (!areBallsStopped() || !cueBall) return;
            const power = (parseFloat(powerSlider.value) / 100) * 22;
            cueBall.vx = Math.cos(aimAngle) * power;
            cueBall.vy = Math.sin(aimAngle) * power;
        }

        // Sinkronisasi Slider Arah Kanan
        angleSlider.addEventListener('input', () => {
            aimAngle = (parseFloat(angleSlider.value) * Math.PI) / 180;
        });

        function resolveCollisions() {
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    const b1 = balls[i];
                    const b2 = balls[j];
                    if (b1.pocketed || b2.pocketed) continue;

                    const dx = b2.x - b1.x;
                    const dy = b2.y - b1.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < BALL_RADIUS * 2) {
                        const angle = Math.atan2(dy, dx);
                        const sin = Math.sin(angle);
                        const cos = Math.cos(angle);

                        const overlap = (BALL_RADIUS * 2) - dist;
                        b1.x -= cos * overlap * 0.5;
                        b1.y -= sin * overlap * 0.5;
                        b2.x += cos * overlap * 0.5;
                        b2.y += sin * overlap * 0.5;

                        const vx1 = b1.vx * cos + b1.vy * sin;
                        const vy1 = b1.vy * cos - b1.vx * sin;
                        const vx2 = b2.vx * cos + b2.vy * sin;
                        const vy2 = b2.vy * cos - b2.vx * sin;

                        b1.vx = vx2 * cos - vy1 * sin;
                        b1.vy = vy1 * cos + vx2 * sin;
                        b2.vx = vx1 * cos - vy2 * sin;
                        b2.vy = vy2 * cos + vx1 * sin;
                    }
                }
            }
        }

        function checkPockets() {
            balls.forEach(b => {
                if (b.pocketed) return;
                pockets.forEach(p => {
                    if (Math.hypot(b.x - p.x, b.y - p.y) < BORDER * 0.8) {
                        b.pocketed = true;
                        b.vx = 0; b.vy = 0;
                        if (b.isCue) {
                            setTimeout(() => {
                                b.x = TABLE_WIDTH * 0.25;
                                b.y = TABLE_HEIGHT / 2;
                                b.pocketed = false;
                            }, 500);
                        }
                    }
                });
            });
        }

        // Sistem Garis Pandu & Pantulan Panjang
        function drawExtendedAimGuides() {
            if (!areBallsStopped() || !cueBall || cueBall.pocketed) return;

            const dirX = Math.cos(aimAngle);
            const dirY = Math.sin(aimAngle);

            let rayX = cueBall.x;
            let rayY = cueBall.y;
            let hitBall = null;
            let minDistance = Infinity;

            // Cek Tabrakan Ray dengan Bola Lain
            balls.forEach(b => {
                if (b.isCue || b.pocketed) return;
                const dx = b.x - cueBall.x;
                const dy = b.y - cueBall.y;
                const proj = dx * dirX + dy * dirY;

                if (proj > 0) {
                    const perpDist = Math.abs(dx * dirY - dy * dirX);
                    if (perpDist < BALL_RADIUS * 2) {
                        const d = proj - Math.sqrt(Math.pow(BALL_RADIUS * 2, 2) - Math.pow(perpDist, 2));
                        if (d < minDistance) {
                            minDistance = d;
                            hitBall = b;
                        }
                    }
                }
            });

            const minX = BORDER + BALL_RADIUS;
            const maxX = TABLE_WIDTH - BORDER - BALL_RADIUS;
            const minY = BORDER + BALL_RADIUS;
            const maxY = TABLE_HEIGHT - BORDER - BALL_RADIUS;

            if (hitBall) {
                // Skenario 1: Menghantam Bola Target
                const ghostX = cueBall.x + dirX * minDistance;
                const ghostY = cueBall.y + dirY * minDistance;

                // Garis Ke Bola Target
                ctx.beginPath();
                ctx.moveTo(cueBall.x, cueBall.y);
                ctx.lineTo(ghostX, ghostY);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.closePath();

                // Lingkaran Bayangan (Ghost Ball)
                ctx.beginPath();
                ctx.arc(ghostX, ghostY, BALL_RADIUS, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.stroke();
                ctx.closePath();

                // Arah Pantulan Bola Target
                const targetAngle = Math.atan2(hitBall.y - ghostY, hitBall.x - ghostX);
                ctx.beginPath();
                ctx.moveTo(hitBall.x, hitBall.y);
                ctx.lineTo(hitBall.x + Math.cos(targetAngle) * 300, hitBall.y + Math.sin(targetAngle) * 300);
                ctx.strokeStyle = '#f1c40f'; // Garis Kuning untuk Bola Target
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.closePath();

            } else {
                // Skenario 2: Menghantam Dinding & Memantul
                let tX = dirX > 0 ? (maxX - cueBall.x) / dirX : (minX - cueBall.x) / dirX;
                let tY = dirY > 0 ? (maxY - cueBall.y) / dirY : (minY - cueBall.y) / dirY;
                let t = Math.min(tX, tY);

                const wallX = cueBall.x + dirX * t;
                const wallY = cueBall.y + dirY * t;

                // Garis ke Dinding
                ctx.beginPath();
                ctx.moveTo(cueBall.x, cueBall.y);
                ctx.lineTo(wallX, wallY);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.closePath();

                // Garis Pantulan Dinding
                let reflectX = dirX;
                let reflectY = dirY;
                if (t === tX) reflectX *= -1;
                if (t === tY) reflectY *= -1;

                ctx.beginPath();
                ctx.moveTo(wallX, wallY);
                ctx.lineTo(wallX + reflectX * 300, wallY + reflectY * 300);
                ctx.strokeStyle = '#e74c3c'; // Garis Merah untuk Pantulan Dinding
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.closePath();
            }

            ctx.setLineDash([]);
        }

        function drawCueStick() {
            if (!areBallsStopped() || !cueBall || cueBall.pocketed) return;

            const power = parseFloat(powerSlider.value);
            const stickOffset = 15 + (power * 0.4);
            const stickLength = 260;

            const startX = cueBall.x - Math.cos(aimAngle) * stickOffset;
            const startY = cueBall.y - Math.sin(aimAngle) * stickOffset;
            const endX = cueBall.x - Math.cos(aimAngle) * (stickOffset + stickLength);
            const endY = cueBall.y - Math.sin(aimAngle) * (stickOffset + stickLength);

            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = '#d35400';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.closePath();
        }

        function drawTable() {
            ctx.fillStyle = '#3a1e0e';
            ctx.fillRect(0, 0, TABLE_WIDTH, TABLE_HEIGHT);

            ctx.fillStyle = '#0d5c2a';
            ctx.fillRect(BORDER, BORDER, TABLE_WIDTH - BORDER * 2, TABLE_HEIGHT - BORDER * 2);

            pockets.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, BORDER * 0.65, 0, Math.PI * 2);
                ctx.fillStyle = '#111';
                ctx.fill();
                ctx.closePath();
            });
        }

        function gameLoop() {
            ctx.clearRect(0, 0, TABLE_WIDTH, TABLE_HEIGHT);

            drawTable();

            balls.forEach(b => b.update());
            resolveCollisions();
            checkPockets();
            balls.forEach(b => b.draw());

            drawExtendedAimGuides();
            drawCueStick();

            requestAnimationFrame(gameLoop);
        }

        function startGame(mode) {
            menuOverlay.style.display = 'none';
            canvas.style.display = 'block';
            panelLeft.style.display = 'flex';
            panelRight.style.display = 'flex';

            initBalls(mode);
            gameLoop();
        }
    </script>
</body>
</html>
