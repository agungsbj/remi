<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mini Pool Game - Accurate Multi-Ball Guide</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
            border-radius: 6px;
            background: #0d5c2a;
            display: none;
        }
        #menu-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            color: white;
        }
        #menu-overlay h1 {
            font-size: 32px;
            margin-bottom: 20px;
            text-transform: uppercase;
            color: #f39c12;
        }
        .btn-group {
            display: flex;
            gap: 20px;
        }
        .mode-btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: #27ae60;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .mode-btn:hover {
            background: #2ecc71;
            transform: scale(1.05);
        }

        /* Panel Kiri */
        #panel-left {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 10px;
            border-radius: 12px;
            color: white;
            z-index: 10;
        }
        #panel-left label {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .slider-vertical {
            writing-mode: bt-lr;
            -webkit-appearance: slider-vertical;
            width: 25px;
            height: 180px;
            cursor: pointer;
        }
        #shoot-btn {
            margin-top: 15px;
            padding: 10px 15px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        #shoot-btn:active { background: #c0392b; }

        /* Panel Kanan */
        #panel-right {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        #aim-wheel {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.8) 100%);
            border: 3px solid #f39c12;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            position: relative;
        }
        #aim-knob {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #f39c12;
            position: absolute;
            pointer-events: none;
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Menu Mode -->
        <div id="menu-overlay">
            <h1>Pilih Mode Permainan</h1>
            <div class="btn-group">
                <button class="mode-btn" onclick="startGame(8)">8-Ball</button>
                <button class="mode-btn" onclick="startGame(9)">9-Ball</button>
            </div>
        </div>

        <!-- Panel Power -->
        <div id="panel-left">
            <label>Power</label>
            <input type="range" id="power-slider" class="slider-vertical" min="1" max="100" value="30">
            <button id="shoot-btn" onclick="shootBall()">TEMBAK</button>
        </div>

        <!-- Panel Wheel Aim -->
        <div id="panel-right">
            <div id="aim-wheel">
                <div id="aim-knob"></div>
            </div>
        </div>

        <canvas id="poolCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('poolCanvas');
        const ctx = canvas.getContext('2d');
        const menuOverlay = document.getElementById('menu-overlay');
        const panelLeft = document.getElementById('panel-left');
        const panelRight = document.getElementById('panel-right');
        const powerSlider = document.getElementById('power-slider');
        const aimWheel = document.getElementById('aim-wheel');
        const aimKnob = document.getElementById('aim-knob');

        const TABLE_WIDTH = 800;
        const TABLE_HEIGHT = 400;
        const BORDER = 30;
        const BALL_RADIUS = 10;

        let balls = [];
        let cueBall;
        let aimAngle = 0; 

        function resizeCanvas() {
            const aspect = TABLE_WIDTH / TABLE_HEIGHT;
            let w = window.innerWidth * 0.8;
            let h = window.innerHeight * 0.8;

            if (w / h > aspect) { w = h * aspect; } 
            else { h = w / aspect; }

            canvas.width = TABLE_WIDTH;
            canvas.height = TABLE_HEIGHT;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Ball {
            constructor(x, y, color, number = 0, isCue = false) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.color = color;
                this.number = number;
                this.isCue = isCue;
                this.pocketed = false;
            }

            update() {
                if (this.pocketed) return;

                this.x += this.vx;
                this.y += this.vy;

                this.vx *= 0.985;
                this.vy *= 0.985;

                if (Math.hypot(this.vx, this.vy) < 0.05) {
                    this.vx = 0;
                    this.vy = 0;
                }

                const minX = BORDER + BALL_RADIUS;
                const maxX = TABLE_WIDTH - BORDER - BALL_RADIUS;
                const minY = BORDER + BALL_RADIUS;
                const maxY = TABLE_HEIGHT - BORDER - BALL_RADIUS;

                if (this.x < minX) { this.x = minX; this.vx *= -1; }
                if (this.x > maxX) { this.x = maxX; this.vx *= -1; }
                if (this.y < minY) { this.y = minY; this.vy *= -1; }
                if (this.y > maxY) { this.y = maxY; this.vy *= -1; }
            }

            draw() {
                if (this.pocketed) return;

                ctx.beginPath();
                ctx.arc(this.x, this.y, BALL_RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.closePath();

                if (this.isCue) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                    ctx.fillStyle = '#000';
                    ctx.fill();
                    ctx.closePath();
                } else if (this.number > 0) {
                    ctx.fillStyle = (this.color === 'white' || this.color === '#f1c40f') ? 'black' : 'white';
                    ctx.font = 'bold 8px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.number, this.x, this.y);
                }
            }
        }

        const pockets = [
            { x: BORDER, y: BORDER },
            { x: TABLE_WIDTH / 2, y: BORDER - 5 },
            { x: TABLE_WIDTH - BORDER, y: BORDER },
            { x: BORDER, y: TABLE_HEIGHT - BORDER },
            { x: TABLE_WIDTH / 2, y: TABLE_HEIGHT - BORDER + 5 },
            { x: TABLE_WIDTH - BORDER, y: TABLE_HEIGHT - BORDER }
        ];

        function initBalls(mode) {
            balls = [];
            cueBall = new Ball(TABLE_WIDTH * 0.25, TABLE_HEIGHT / 2, 'white', 0, true);
            balls.push(cueBall);

            const startX = TABLE_WIDTH * 0.7;
            const startY = TABLE_HEIGHT / 2;
            const colors = ['#f1c40f', '#2980b9', '#e74c3c', '#8e44ad', '#e67e22', '#27ae60', '#95a5a6', '#2c3e50', '#f39c12'];

            if (mode === 8) {
                let idx = 1;
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c <= r; c++) {
                        const x = startX + r * (BALL_RADIUS * 2 * 0.866);
                        const y = startY + (c - r / 2) * (BALL_RADIUS * 2 + 1);
                        balls.push(new Ball(x, y, colors[(idx - 1) % colors.length], idx));
                        idx++;
                    }
                }
            } else {
                const layout = [[0,0], [1,-0.5], [1,0.5], [2,-1], [2,0], [2,1], [3,-0.5], [3,0.5], [4,0]];
                layout.forEach((pos, i) => {
                    const x = startX + pos[0] * (BALL_RADIUS * 2 * 0.866);
                    const y = startY + pos[1] * (BALL_RADIUS * 2 + 1);
                    balls.push(new Ball(x, y, colors[i % colors.length], i + 1));
                });
            }
        }

        function areBallsStopped() {
            return balls.every(b => b.vx === 0 && b.vy === 0);
        }

        function shootBall() {
            if (!areBallsStopped() || !cueBall) return;
            const power = (parseFloat(powerSlider.value) / 100) * 22;
            cueBall.vx = Math.cos(aimAngle) * power;
            cueBall.vy = Math.sin(aimAngle) * power;
        }

        // CONTROL WHEEL AIM
        let isWheelDragging = false;

        function updateWheelAngle(e) {
            const rect = aimWheel.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const dx = clientX - centerX;
            const dy = clientY - centerY;

            aimAngle = Math.atan2(dy, dx);

            const knobRadius = 40;
            const knobX = Math.cos(aimAngle) * knobRadius;
            const knobY = Math.sin(aimAngle) * knobRadius;

            aimKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;
        }

        function onWheelStart(e) {
            isWheelDragging = true;
            updateWheelAngle(e);
        }
        function onWheelMove(e) {
            if (isWheelDragging) updateWheelAngle(e);
        }
        function onWheelEnd() {
            isWheelDragging = false;
        }

        aimWheel.addEventListener('mousedown', onWheelStart);
        window.addEventListener('mousemove', onWheelMove);
        window.addEventListener('mouseup', onWheelEnd);

        aimWheel.addEventListener('touchstart', onWheelStart);
        window.addEventListener('touchmove', onWheelMove);
        window.addEventListener('touchend', onWheelEnd);

        function resolveCollisions() {
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    const b1 = balls[i];
                    const b2 = balls[j];
                    if (b1.pocketed || b2.pocketed) continue;

                    const dx = b2.x - b1.x;
                    const dy = b2.y - b1.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < BALL_RADIUS * 2) {
                        const angle = Math.atan2(dy, dx);
                        const sin = Math.sin(angle);
                        const cos = Math.cos(angle);

                        const overlap = (BALL_RADIUS * 2) - dist;
                        b1.x -= cos * overlap * 0.5;
                        b1.y -= sin * overlap * 0.5;
                        b2.x += cos * overlap * 0.5;
                        b2.y += sin * overlap * 0.5;

                        const vx1 = b1.vx * cos + b1.vy * sin;
                        const vy1 = b1.vy * cos - b1.vx * sin;
                        const vx2 = b2.vx * cos + b2.vy * sin;
                        const vy2 = b2.vy * cos - b2.vx * sin;

                        b1.vx = vx2 * cos - vy1 * sin;
                        b1.vy = vy1 * cos + vx2 * sin;
                        b2.vx = vx1 * cos - vy2 * sin;
                        b2.vy = vy2 * cos + vx1 * sin;
                    }
                }
            }
        }

        function checkPockets() {
            balls.forEach(b => {
                if (b.pocketed) return;
                pockets.forEach(p => {
                    if (Math.hypot(b.x - p.x, b.y - p.y) < BORDER * 0.8) {
                        b.pocketed = true;
                        b.vx = 0; b.vy = 0;
                        if (b.isCue) {
                            setTimeout(() => {
                                b.x = TABLE_WIDTH * 0.25;
                                b.y = TABLE_HEIGHT / 2;
                                b.pocketed = false;
                            }, 500);
                        }
                    }
                });
            });
        }

        // UTILS DETEKSI RAYCASTING AKURAT
        function findFirstBallHit(startX, startY, dirX, dirY, ignoreBalls = []) {
            let hitBall = null;
            let minDistance = Infinity;

            balls.forEach(b => {
                if (b.pocketed || ignoreBalls.includes(b)) return;
                const dx = b.x - startX;
                const dy = b.y - startY;
                const proj = dx * dirX + dy * dirY;

                if (proj > 0) {
                    const perpDist = Math.abs(dx * dirY - dy * dirX);
                    if (perpDist < BALL_RADIUS * 2) {
                        const d = proj - Math.sqrt(Math.pow(BALL_RADIUS * 2, 2) - Math.pow(perpDist, 2));
                        if (d < minDistance) {
                            minDistance = d;
                            hitBall = b;
                        }
                    }
                }
            });

            return { hitBall, minDistance };
        }

        function findWallHit(startX, startY, dirX, dirY) {
            const minX = BORDER + BALL_RADIUS;
            const maxX = TABLE_WIDTH - BORDER - BALL_RADIUS;
            const minY = BORDER + BALL_RADIUS;
            const maxY = TABLE_HEIGHT - BORDER - BALL_RADIUS;

            let tX = dirX > 0 ? (maxX - startX) / dirX : (minX - startX) / dirX;
            let tY = dirY > 0 ? (maxY - startY) / dirY : (minY - startY) / dirY;
            let t = Math.min(tX, tY);

            return {
                wallX: startX + dirX * t,
                wallY: startY + dirY * t,
                isXWall: t === tX
            };
        }

        // SYSTEM GUIDE LINE MULTI-BALL & MULTI-BOUNCE
        function drawExtendedAimGuides() {
            if (!areBallsStopped() || !cueBall || cueBall.pocketed) return;

            const dirX = Math.cos(aimAngle);
            const dirY = Math.sin(aimAngle);

            // 1. Bola Putih ke Bola Sasaran Pertama
            const firstHit = findFirstBallHit(cueBall.x, cueBall.y, dirX, dirY, [cueBall]);

            if (firstHit.hitBall) {
                const targetBall1 = firstHit.hitBall;
                const ghost1X = cueBall.x + dirX * firstHit.minDistance;
                const ghost1Y = cueBall.y + dirY * firstHit.minDistance;

                // Garis Bola Putih -> Ghost Ball 1
                ctx.beginPath();
                ctx.moveTo(cueBall.x, cueBall.y);
                ctx.lineTo(ghost1X, ghost1Y);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.closePath();

                // Lingkaran Bayangan Ghost Ball 1
                ctx.beginPath();
                ctx.arc(ghost1X, ghost1Y, BALL_RADIUS, 0, Math.PI * 2);
                ctx.strokeStyle = '#2ecc71';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.closePath();

                // Arah Gerak Bola Sasaran 1 setelah ditabrak
                const angle1 = Math.atan2(targetBall1.y - ghost1Y, targetBall1.x - ghost1X);
                const dir1X = Math.cos(angle1);
                const dir1Y = Math.sin(angle1);

                // Cek apakah Bola 1 mengenai bola lain sebelum/sesudah ke dinding
                const secondHit = findFirstBallHit(targetBall1.x, targetBall1.y, dir1X, dir1Y, [targetBall1, cueBall]);
                const wallHit1 = findWallHit(targetBall1.x, targetBall1.y, dir1X, dir1Y);

                if (secondHit.hitBall && secondHit.minDistance < Math.hypot(wallHit1.wallX - targetBall1.x, wallHit1.wallY - targetBall1.y)) {
                    // Bola 1 Menabrak Bola 2 Langsung
                    const targetBall2 = secondHit.hitBall;
                    const ghost2X = targetBall1.x + dir1X * secondHit.minDistance;
                    const ghost2Y = targetBall1.y + dir1Y * secondHit.minDistance;

                    ctx.beginPath();
                    ctx.moveTo(targetBall1.x, targetBall1.y);
                    ctx.lineTo(ghost2X, ghost2Y);
                    ctx.strokeStyle = '#f1c40f'; // Garis Kuning
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.closePath();

                    // Ghost Ball 2
                    ctx.beginPath();
                    ctx.arc(ghost2X, ghost2Y, BALL_RADIUS, 0, Math.PI * 2);
                    ctx.strokeStyle = '#e67e22';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.closePath();

                    // Arah Bola 2 Terpental
                    const angle2 = Math.atan2(targetBall2.y - ghost2Y, targetBall2.x - ghost2X);
                    ctx.beginPath();
                    ctx.moveTo(targetBall2.x, targetBall2.y);
                    ctx.lineTo(targetBall2.x + Math.cos(angle2) * 500, targetBall2.y + Math.sin(angle2) * 500);
                    ctx.strokeStyle = '#9b59b6'; // Purple Line Bola 2
                    ctx.lineWidth = 2;
                    ctx.setLineDash([3, 3]);
                    ctx.stroke();
                    ctx.closePath();

                } else {
                    // Bola 1 Menuju Ban/Rail Dinding
                    ctx.beginPath();
                    ctx.moveTo(targetBall1.x, targetBall1.y);
                    ctx.lineTo(wallHit1.wallX, wallHit1.wallY);
                    ctx.strokeStyle = '#f1c40f'; // Garis Kuning
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.closePath();

                    // Pantulan dari Dinding
                    let ref1X = wallHit1.isXWall ? -dir1X : dir1X;
                    let ref1Y = wallHit1.isXWall ? dir1Y : -dir1Y;

                    // Cek apakah Bola 1 setelah memantul dinding mengenai bola lain
                    const hitAfterBounce = findFirstBallHit(wallHit1.wallX, wallHit1.wallY, ref1X, ref1Y, [targetBall1, cueBall]);

                    if (hitAfterBounce.hitBall) {
                        const targetBall2 = hitAfterBounce.hitBall;
                        const ghost2X = wallHit1.wallX + ref1X * hitAfterBounce.minDistance;
                        const ghost2Y = wallHit1.wallY + ref1Y * hitAfterBounce.minDistance;

                        // Garis Dinding -> Bola 2
                        ctx.beginPath();
                        ctx.moveTo(wallHit1.wallX, wallHit1.wallY);
                        ctx.lineTo(ghost2X, ghost2Y);
                        ctx.strokeStyle = '#e67e22'; // Garis Oranye
                        ctx.lineWidth = 2;
                        ctx.setLineDash([4, 4]);
                        ctx.stroke();
                        ctx.closePath();

                        // Ghost Ball di Bola 2
                        ctx.beginPath();
                        ctx.arc(ghost2X, ghost2Y, BALL_RADIUS, 0, Math.PI * 2);
                        ctx.strokeStyle = '#3498db';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                        ctx.closePath();

                        // Pantulan Arah Bola 2
                        const angle2 = Math.atan2(targetBall2.y - ghost2Y, targetBall2.x - ghost2X);
                        ctx.beginPath();
                        ctx.moveTo(targetBall2.x, targetBall2.y);
                        ctx.lineTo(targetBall2.x + Math.cos(angle2) * 500, targetBall2.y + Math.sin(angle2) * 500);
                        ctx.strokeStyle = '#9b59b6'; // Garis Pantulan Bola Kedua
                        ctx.lineWidth = 2;
                        ctx.stroke();
                        ctx.closePath();
                    } else {
                        // Tidak ada bola lagi, melaju lurus pantulan dinding
                        ctx.beginPath();
                        ctx.moveTo(wallHit1.wallX, wallHit1.wallY);
                        ctx.lineTo(wallHit1.wallX + ref1X * 600, wallHit1.wallY + ref1Y * 600);
                        ctx.strokeStyle = '#e67e22';
                        ctx.lineWidth = 2;
                        ctx.setLineDash([4, 4]);
                        ctx.stroke();
                        ctx.closePath();
                    }
                }
            } else {
                // Bola Putih tidak kena bola manapun, langsung ke dinding
                const wall = findWallHit(cueBall.x, cueBall.y, dirX, dirY);
                ctx.beginPath();
                ctx.moveTo(cueBall.x, cueBall.y);
                ctx.lineTo(wall.wallX, wall.wallY);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.closePath();

                let refX = wall.isXWall ? -dirX : dirX;
                let refY = wall.isXWall ? dirY : -dirY;

                ctx.beginPath();
                ctx.moveTo(wall.wallX, wall.wallY);
                ctx.lineTo(wall.wallX + refX * 600, wall.wallY + refY * 600);
                ctx.strokeStyle = '#e74c3c';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.closePath();
            }

            ctx.setLineDash([]);
        }

        function drawCueStick() {
            if (!areBallsStopped() || !cueBall || cueBall.pocketed) return;

            const power = parseFloat(powerSlider.value);
            const stickOffset = 15 + (power * 0.4);
            const stickLength = 260;

            const startX = cueBall.x - Math.cos(aimAngle) * stickOffset;
            const startY = cueBall.y - Math.sin(aimAngle) * stickOffset;
            const endX = cueBall.x - Math.cos(aimAngle) * (stickOffset + stickLength);
            const endY = cueBall.y - Math.sin(aimAngle) * (stickOffset + stickLength);

            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = '#d35400';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.closePath();
        }

        function drawTable() {
            ctx.fillStyle = '#3a1e0e';
            ctx.fillRect(0, 0, TABLE_WIDTH, TABLE_HEIGHT);

            ctx.fillStyle = '#0d5c2a';
            ctx.fillRect(BORDER, BORDER, TABLE_WIDTH - BORDER * 2, TABLE_HEIGHT - BORDER * 2);

            pockets.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, BORDER * 0.65, 0, Math.PI * 2);
                ctx.fillStyle = '#111';
                ctx.fill();
                ctx.closePath();
            });
        }

        function gameLoop() {
            ctx.clearRect(0, 0, TABLE_WIDTH, TABLE_HEIGHT);

            drawTable();

            balls.forEach(b => b.update());
            resolveCollisions();
            checkPockets();
            balls.forEach(b => b.draw());

            drawExtendedAimGuides();
            drawCueStick();

            requestAnimationFrame(gameLoop);
        }

        function startGame(mode) {
            menuOverlay.style.display = 'none';
            canvas.style.display = 'block';
            panelLeft.style.display = 'flex';
            panelRight.style.display = 'flex';

            initBalls(mode);
            gameLoop();
        }
    </script>
</body>
</html>
